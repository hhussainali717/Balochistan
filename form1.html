<!DOCTYPE html>
<html lang="eng">
    <head>
        <title>form</title>
    </head>
    <style>

       div{
          background:linear-gradient(135deg, #b388eb,#f7aef8);
          box-sizing: border-box;
          box-shadow: #3f0f3f;
          padding: 90px;
          margin: 50px;
          width: 90%;
         max-width: 400px;
         justify-content: center;
          min-height: 50vh;
          border-radius: 27px; 

       }
       
    
        
        
    </style>
    <body class="body">
       <div style="text-align: center; margin: 50px;">
       <h1 style="color: #8093f1;">SIGN IN</h1>

            <form>
                
                <label for="fname"></label>
                <input type="text" name="fname" id="fname" placeholder="Enter your name" required>
                       <br>
               
               <label for="password"></label>
                <input type="password" name="password" id="password" minlength="8" pattern="3" placeholder="Password" required><br>
                       <br>
                
                <button>SIGN IN</button>
                        <br>
                <a href="forgot.html">forgot password?</a>
                        <br>
                
                <p style="color: #ccccb1;">don't have an account?</p>
                
                <a href="forgot.html">SIGN UP</a>
            </form>
       </div>
    </body>
</html>
